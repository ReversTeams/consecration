plugins {
 id 'java-library'
 id 'net.neoforged.moddev' version '2.0.148'
}
version = project.property('version')
group = 'com.illusivesoulworks.consecration'
base { archivesName = 'consecration-neoforge' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
sourceSets.main {
 java.srcDirs = ['common/src/main/java','neoforge/src/main/java']
 resources.srcDirs = ['common/src/main/resources','neoforge/src/main/resources']
}
neoForge {
 version = neo_version
 runs { client { client() }; server { server(); programArgument '--nogui' } }
 mods { consecration { sourceSet sourceSets.main } }
}
tasks.named('processResources', ProcessResources) {
 filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar') { from('LICENSE'); from('COPYING'); from('COPYING.LESSER') }

repositories { maven { url = 'https://api.modrinth.com/maven' } }
dependencies {
 compileOnly('maven.modrinth:silent-gear:VRVOMdub') { transitive = false }
 compileOnly('maven.modrinth:vampirism:8KCSZKt6') { transitive = false }
}
